server {
	listen		3380 default_server;

	server_name	_;

	root	/usr/share/webapps/phpmyadmin;
	index	index.php;

	location ~ \.php$ {
		try_files		$uri =404;
		fastcgi_pass	127.0.0.1:9000;
		fastcgi_index	index.php;
		include			/etc/nginx/fastcgi.conf;
	}
}

server {
	listen		3381 ssl default_server;

	server_name	_;

	ssl_certificate /conf.d/certs/cert.crt;
	ssl_certificate_key /conf.d/certs/cert.key;

	root	/usr/share/webapps/phpmyadmin;
	index	index.php;

	location ~ \.php$ {
		try_files		$uri =404;
		fastcgi_pass	127.0.0.1:9000;
		fastcgi_index	index.php;
		include			/etc/nginx/fastcgi.conf;
	}
}

